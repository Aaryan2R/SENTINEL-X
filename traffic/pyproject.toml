[project]
name = "sentinel-x-traffic"
version = "0.1.0"
description = "SENTINEL-X traffic generation and replay (demo tooling only)"
requires-python = ">=3.13,<3.15"
license = "LicenseRef-Proprietary"

# Scapy is GPL — demo tooling only, never in engine runtime (DEP-2, T-083)
dependencies = [
    "scapy>=2.6,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator"]
