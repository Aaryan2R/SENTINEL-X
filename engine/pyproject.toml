[project]
name = "sentinel-x-engine"
version = "0.1.0"
description = "SENTINEL-X passive network threat detection engine"
requires-python = ">=3.13,<3.15"
license = "LicenseRef-Proprietary"

dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6,<7",
    "structlog>=25.1,<26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "S",         # bandit (security)
    "B",         # bugbear
    "A",         # builtins
    "C4",        # comprehensions
    "T20",       # print (PY-7: no print in services)
    "RET",       # return
    "SIM",       # simplify
    "TCH",       # type-checking imports
    "RUF",       # ruff-specific
]
ignore = [
    "S101",      # assert in tests is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "T20"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest-anyio>=0.0.0",
]
